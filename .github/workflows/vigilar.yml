name: Vigilar WEB

on:
  workflow_dispatch:

concurrency:
  group: vigilar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la página
        run: python monitor.py
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_EXTENSIONES: ${{ vars.MONITOR_EXTENSIONES }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar el estado
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add snapshot.txt
          git diff --staged --quiet || (git commit -m "Actualiza snapshot" && git push)
